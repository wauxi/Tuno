<VirtualHost *:80>
    # API routes via /api/
    Alias /api /var/www/html/src/php/api

    <Directory /var/www/html/src/php>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Static files (uploads) served from /var/www/html/public/
    # URL: http://localhost:8080/uploads/... → File: /var/www/html/public/uploads/...
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
